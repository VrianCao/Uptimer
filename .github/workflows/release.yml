name: Reviewed Cloudflare release

on:
  workflow_call:
    inputs:
      action:
        type: string
        required: true
      plan_run:
        type: string
        default: ''
      plan_hash:
        type: string
        default: ''
      operation:
        type: string
        default: upgrade
      hosting:
        type: string
        default: auto

permissions:
  contents: read
  actions: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: ${{ inputs.action == 'apply' && 'cloudflare-release' || 'cloudflare-plan' }}
    # Serializes all release refs/profiles targeting this installation. The Dev
    # caller also shares its existing target lock with historical audit runs.
    concurrency:
      group: reviewed-cloudflare-${{ vars.UPTIMER_WORKER_NAME || vars.UPTIMER_PREFIX || github.event.repository.name }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ github.repository == 'VrianCao/UptimerDev' && 'd0e503309591b218a458127b73b0d227' || secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      UPTIMER_ADMIN_TOKEN: ${{ secrets.UPTIMER_ADMIN_TOKEN }}
      UPTIMER_PREFIX: ${{ vars.UPTIMER_PREFIX }}
      UPTIMER_WORKER_NAME: ${{ github.repository == 'VrianCao/UptimerDev' && 'uptimerdev' || vars.UPTIMER_WORKER_NAME }}
      UPTIMER_D1_NAME: ${{ github.repository == 'VrianCao/UptimerDev' && 'uptimerdev' || vars.UPTIMER_D1_NAME }}
      UPTIMER_D1_ID: ${{ github.repository == 'VrianCao/UptimerDev' && '5f5382be-6cf2-4315-a6a3-6d78d42fe3b3' || vars.UPTIMER_D1_ID }}
      UPTIMER_PAGES_PROJECT: ${{ github.repository == 'VrianCao/UptimerDev' && 'uptimerdev' || vars.UPTIMER_PAGES_PROJECT }}
      UPTIMER_WORKER_URL: ${{ vars.UPTIMER_WORKER_URL }}
      UPTIMER_DEPLOY_MODE: ${{ vars.UPTIMER_DEPLOY_MODE || 'pages' }}
      UPTIMER_RUNTIME_PROFILE: ${{ vars.UPTIMER_RUNTIME_PROFILE || 'free' }}
      UPTIMER_API_BASE: ${{ vars.UPTIMER_API_BASE }}
      UPTIMER_API_ORIGIN: ${{ vars.UPTIMER_API_ORIGIN }}
      VITE_ADMIN_PATH: ${{ secrets.VITE_ADMIN_PATH || vars.VITE_ADMIN_PATH || vars.UPTIMER_ADMIN_PATH }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      RELEASE_HOSTING: ${{ inputs.hosting }}
      RELEASE_ACTION: ${{ inputs.action }}
      RELEASE_PLAN_RUN: ${{ inputs.plan_run }}
      RELEASE_PLAN_SHA: ${{ inputs.plan_hash }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Set isolated artifact and CLI log directories
        run: |
          echo "RELEASE_DIRECTORY=$RUNNER_TEMP/uptimer-release" >> "$GITHUB_ENV"
          echo "WRANGLER_LOG_PATH=$RUNNER_TEMP/wrangler-release.log" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate action and reviewed plan provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/worker/scripts/release-provenance.mjs
      - name: Download the reviewed immutable deployment package
        if: inputs.action == 'apply'
        uses: actions/download-artifact@v4
        with:
          name: uptimer-release-package
          path: ${{ env.RELEASE_DIRECTORY }}
          run-id: ${{ inputs.plan_run }}
          github-token: ${{ github.token }}
      - name: Plan without cloud writes, or apply the exact reviewed package
        run: node apps/worker/scripts/release.mjs "$RELEASE_ACTION"
      - name: Upload immutable plan and complete package
        if: inputs.action == 'plan' && success()
        uses: actions/upload-artifact@v4
        with:
          name: uptimer-release-package
          include-hidden-files: true
          path: ${{ env.RELEASE_DIRECTORY }}/
          if-no-files-found: error
          retention-days: 30
      - name: Upload sanitized deployment receipt even after partial failure
        if: always() && inputs.action == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_attempt == '1' && 'uptimer-release-receipt' || format('uptimer-release-receipt-attempt-{0}', github.run_attempt) }}
          path: |
            ${{ env.RELEASE_DIRECTORY }}/checkpoint.json
            ${{ env.RELEASE_DIRECTORY }}/verification.json
          if-no-files-found: ignore
          retention-days: 30
