name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/setup-node with `cache: pnpm` expects pnpm to be on PATH.
      - uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      - name: Release operations tests
        run: pnpm test:release

      - name: Generated bindings
        run: pnpm --filter @uptimer/worker types:check

      - name: Immutable published migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="$(git rev-parse HEAD^)"; fi
          node apps/worker/scripts/release-check.mjs migrations "$base"

      - name: Typecheck
        run: pnpm -r typecheck

  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Clean coverage outputs
        run: rm -rf apps/worker/coverage apps/worker/coverage-cron

      - name: Cron scheduler tests
        run: pnpm --filter @uptimer/worker test:cron

      - name: Coverage summary (cron scheduler)
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/worker/coverage-cron/coverage-summary.json';
          if (!fs.existsSync(path)) {
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              '### Cron Coverage\n\nCron coverage summary not found.\n',
            );
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const total = report.total ?? {};
          const formatPct = (value) => `${Number(value ?? 0).toFixed(2)}%`;

          const lines = [
            '### Cron Coverage',
            '',
            `- Statements: **${formatPct(total.statements?.pct)}**`,
            `- Branches: **${formatPct(total.branches?.pct)}**`,
            `- Functions: **${formatPct(total.functions?.pct)}**`,
            `- Lines: **${formatPct(total.lines?.pct)}**`,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Test
        run: pnpm test

      - name: Coverage summary (worker)
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/worker/coverage/coverage-summary.json';
          if (!fs.existsSync(path)) {
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              '### Worker Coverage\n\nCoverage summary not found.\n',
            );
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const total = report.total ?? {};
          const formatPct = (value) => `${Number(value ?? 0).toFixed(2)}%`;

          const lines = [
            '### Worker Coverage',
            '',
            `- Statements: **${formatPct(total.statements?.pct)}**`,
            `- Branches: **${formatPct(total.branches?.pct)}**`,
            `- Functions: **${formatPct(total.functions?.pct)}**`,
            `- Lines: **${formatPct(total.lines?.pct)}**`,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Upload worker coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: worker-coverage
          path: |
            apps/worker/coverage
            apps/worker/coverage-cron
          if-no-files-found: ignore
          retention-days: 7

  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [free, paid]
        hosting: [pages, single_worker]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend and validate bundled Worker without cloud access
        run: node apps/worker/scripts/release-check.mjs '${{ matrix.profile }}' '${{ matrix.hosting }}'

  migration-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.8.1'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rehearse legacy migrations, interruption and cold recovery locally
        id: drill
        run: node apps/worker/scripts/verify-migration-recovery.mjs full
      - name: Upload sanitized local recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: migration-recovery-evidence
          path: |
            ${{ steps.drill.outputs.evidence_directory }}/summary.json
            ${{ steps.drill.outputs.evidence_directory }}/runtime-summary.json
          if-no-files-found: error
          retention-days: 30
